<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Biblia</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>📖 LA BIBLIA</h1>
    <p>Conocemos a sus personajes y descubrimos sus historias</p>

  <main>

    <div class="unidades">

      <!-- PERSONAJES DEL ANTIGUO TESTAMENTO -->
      <div class="unidad">
        <img class="portada"
             src="tarjeta-biblia-personajes-at.png"
             alt="Personajes del Antiguo Testamento">

        <div class="info">
          <div class="numero">01</div>
          <h3>Personajes AT</h3>

          <div class="boton">
            <a href="biblia-personajes-at.html">
              📖 Ver personajes
            </a>
          </div>
        </div>
      </div>


      <!-- PARÁBOLAS -->
      <div class="unidad">
        <img class="portada"
             src="tarjeta-biblia-parabolas.png"
             alt="Parábolas">

        <div class="info">
          <div class="numero">02</div>
          <h3>Las parábolas</h3>

          <div class="boton">
            <a href="biblia-parabolas.html">
              📖 Ver parábolas
            </a>
          </div>
        </div>

      <!-- MILAGROS -->
      <div class="unidad">
        <img class="portada"
             src="tarjeta-biblia-milagros.png"
             alt="Milagros de Jesús">

        <div class="info">
          <div class="numero">03</div>
          <h3>Los milagros</h3>

          <div class="boton">
            <a href="biblia-milagros.html">
              📖 Ver milagros
            </a>
          </div>
        </div>
      </div>


      <!-- PERSONAJES DEL NUEVO TESTAMENTO -->
      <div class="unidad">
        <img class="portada"
             src="tarjeta-biblia-personajes-nt.png"
             alt="Personajes del Nuevo Testamento">

        <div class="info">
          <div class="numero">04</div>
          <h3>Personajes NT</h3>

          <div class="boton">
            <a href="biblia-personajes-nt.html">
              📖 Ver personajes
            </a>
          </div>
        </div>
      </div>

    </div>

</html>
