<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos · Religión en nuestra aula</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f5ea;
    color:#243746;
}

header{
    text-align:center;
    padding:35px 20px 20px;
}

h1{
    font-size:42px;
    margin:10px 0;
}

.subtitulo{
    font-size:20px;
    color:#596b75;
}

.contenedor{
    max-width:1100px;
    margin:20px auto 60px;
    padding:20px;
}

.cursos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.curso{
    display:block;
    text-decoration:none;
    color:#243746;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.10);
    transition:transform 0.2s, box-shadow 0.2s;
}

.curso img{
    width:100%;
    height:auto;
    display:block;
    border-radius:30px;
}

.curso:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 30px rgba(0,0,0,0.15);
}

.numero{
    font-size:48px;
    font-weight:bold;
    margin-bottom:10px;
}

.curso h2{
    margin:8px 0;
    font-size:25px;
}

.curso p{
    margin:8px 0 0;
    color:#687780;
}

.volver{
    display:inline-block;
    margin-top:35px;
    padding:12px 24px;
    background:#243746;
    color:white;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:800px){
    .cursos{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    .cursos{
        grid-template-columns:1fr;
    }

    h1{
        font-size:34px;
    }
}
</style>
</head>

<body>

<header>
    <div style="font-size:50px;">📚</div>
    <h1>Elige tu curso</h1>
    <p class="subtitulo">Religión en nuestra aula</p>
</header>

<div class="contenedor">

  <div class="cursos">

    <a class="curso" href="curso-1.html">
        <img src="tarjeta-curso-1.png" alt="1.º de Primaria">
    </a>

    <a class="curso" href="curso-2.html">
        <img src="tarjeta-curso-2.png" alt="2.º de Primaria">
    </a>

    <a class="curso" href="curso-3.html">
        <img src="tarjeta-curso-3.png" alt="3.º de Primaria">
    </a>

    <a class="curso" href="curso-4.html">
        <img src="tarjeta-curso-4.png" alt="4.º de Primaria">
    </a>

    <a class="curso" href="curso-5.html">
        <img src="tarjeta-curso-5.png" alt="5.º de Primaria">
    </a>

    <a class="curso" href="curso-6.html">
        <img src="tarjeta-curso-6.png" alt="6.º de Primaria">
    </a>

</div>

    <div style="text-align:center;">
        <a class="volver" href="index.html">← Volver al inicio</a>
    </div>

</div>

</body>
</html>
