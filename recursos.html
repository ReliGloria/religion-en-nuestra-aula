<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffaf0;
  color: #17364f;
  font-family: "Nunito", sans-serif;
}


/* =========================
   CABECERA
========================= */

header {
  text-align: center;
  padding: 35px 6% 45px;
}

.brand {
  text-align: left;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 38px;
  color: #17364f;
}

.eyebrow {
  font-size: 15px;
  letter-spacing: 3px;
  color: #6c7b83;
  font-weight: 800;
}

h1 {
  font-family: "Baloo 2", sans-serif;
  font-size: 58px;
  line-height: 1;
  margin: 8px 0 8px;
  color: #165a91;
  font-weight: 800;
}

.subtitle {
  font-size: 19px;
  color: #637782;
  margin: 0;
  font-weight: 600;
}


/* CONTENEDOR */

.contenedor{
    max-width:1200px;
    margin:20px auto 70px;
    padding:20px;
}

/* TARJETAS */

.recursos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
    margin-top:50px;
}

.tarjeta{
    display:block;
    text-decoration:none;
    color:#243746;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.10);
    transition:transform 0.2s, box-shadow 0.2s;
}
.tarjeta img{
    width:100%;
    height:auto;
    display:block;
}
.tarjeta:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 30px rgba(0,0,0,0.15);
}



.icono{
    font-size:70px;
    margin-bottom:20px;
}

.tarjeta h2{
    font-size:27px;
    margin:10px 0 15px;
}

.tarjeta p{
    font-size:18px;
    line-height:1.6;
    color:#596b75;
}

.entrar{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    border-radius:20px;
    background:#eef4ed;
    font-weight:bold;
}

/* VOLVER */

.volver{
    display:inline-block;
    margin-top:35px;
    text-decoration:none;
    color:#243746;
    font-weight:bold;
}

/* MÓVIL */

@media(max-width:800px){

    .recursos{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:38px;
    }

}

</style>
</head>

<header>

<p>

</p>

</header>


<main class="contenedor">

<div class="recursos">

</a>

<a class="tarjeta" href="biblia.html">
    <img src="tarjeta-biblia.png" alt="Biblia">
</a>

    <img src="Tarjeta-trivial.png" alt="Trivial">

</div>

</div>


<a class="volver" href="primaria.html">
.volver-arriba {
    position: absolute;
    top: 25px;

    border-radius: 999px;
}

← Volver a Primaria
